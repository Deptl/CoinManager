_format_version: "2.1"
_transform: true

services:
  - name: expense-service
    url: http://expense-service:8080
    routes:
      - name: expense-service-route
        paths:
          - /expense/v1
        strip_path: false
        preserve_hoast: false
    plugins:
      - name: custom-auth
        config:
          auth_service_url: http://authservice:9898/auth/v1/ping
  
  - name: message-service
    url: http://messageservice:8010
    routes:
      - name: message-service-route
        paths:
          - /message/v1/ms
        strip_path: false
        preserve_host: false
    plugins:
      - name: custom-auth
        config:
          auth_service_url: http://authservice:9898/auth/v1/ping
  
  - name: user-service
    url: http://userservice:9810
    routes:
      - name: user-service-route
        paths:
          - /user/v1
        strip_path: false
        preserve_host: false
    plugins:
      - name: custom-auth
        config:
          auth_service_url: http://authservice:9898/auth/v1/ping

  - name: auth-service
    url: http://authservice:9898
    routes:
      - name: auth-service-route
        paths:
          - /auth/v1
        strip_path: false
        preserve_host: false